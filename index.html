<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>坦克大战 Tank Battle</title>
  <meta name="description" content="经典坦克大战网页版，纯 HTML5 Canvas 实现">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <header class="header">
      <h1>坦克大战 <span>Tank Battle</span></h1>
      <p class="sub">方向键 / WASD 移动 · 空格 / J 射击 · P 暂停 · M 静音</p>
    </header>
    <div class="stage">
      <canvas id="game" width="664" height="480"></canvas>
    </div>
    <footer class="footer">
      <p>保护基地 🏠，消灭全部敌人。吃 ★ 升级武器，吃 ♥ 加命。</p>
    </footer>
  </div>
  <script src="game.js"></script>
</body>
</html>
